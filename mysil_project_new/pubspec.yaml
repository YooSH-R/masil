name: mysil_project_new
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  dio: ^5.3.3
  go_router: ^12.0.0
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  logger: ^2.0.2
  google_sign_in: ^7.2.0
  kakao_flutter_sdk_user: ^2.0.0+1
  google_fonts: ^8.2.0
  kakao_map_plugin: ^0.4.0
  mobile_scanner: ^7.4.0

# kakao_map_plugin 0.4.0 은 자기 compileSdk 를 35 로 고정해 두었는데,
# webview_flutter_android 4.11+ 는 의존하는 쪽에 compileSdk 36 이상을 요구한다.
# (플러그인 선언은 ^4.7.0 이라 caret 범위가 4.13.0 까지 열려 빌드가 깨진다)
# 플러그인이 SDK 36 으로 올라오면 이 override 를 지우면 된다.
dependency_overrides:
  webview_flutter_android: 4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
