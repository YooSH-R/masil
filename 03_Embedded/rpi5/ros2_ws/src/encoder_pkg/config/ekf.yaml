ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    # False: Jetson's doc says it's tentatively taking ownership of the
    # odom->base_link TF broadcast. Flip this to true (and make sure Jetson
    # stops publishing it) if we later decide RPi5 should own TF instead.
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: trust its linear velocity and yaw rate, not its own
    # integrated heading (that's what the IMU is here to correct).
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU (BNO055): trust its absolute yaw (already sensor-fused onboard)
    # and its yaw rate.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
