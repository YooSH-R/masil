workflow:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
      changes:
        - 02_Backend/**/*
        - 06_Infra/postgres/**/*
    - when: never

stages:
  - context
  - verify

pipeline_context:
  stage: context
  image: alpine:3.21
  script:
    - echo "Merge request pipeline for ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME} -> ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - echo "Commit ${CI_COMMIT_SHA}"

backend_verify:
  stage: verify
  image: eclipse-temurin:17-jdk
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - cd 02_Backend
    - chmod +x gradlew
  script:
    - ./gradlew clean test --no-daemon
  cache:
    key:
      files:
        - 02_Backend/gradle/wrapper/gradle-wrapper.properties
        - 02_Backend/build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - 02_Backend/build/test-results/test/TEST-*.xml
    paths:
      - 02_Backend/build/reports/tests/test/
