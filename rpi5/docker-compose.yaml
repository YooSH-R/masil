services:
  ros2_humble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpi5_humble
    network_mode: "host"
    privileged: true
    restart: unless-stopped
    volumes:
      - ./ros2_ws/src:/root/ros2_ws/src
    tty: true
    stdin_open: true
    command: /root/ros2_ws/src/start_robot.sh
    environment:
      - ROS_DOMAIN_ID=30
