grafana:
  enabled: true
  grafana.ini:
    server:
      domain: i15a203.p.ssafy.io
      root_url: https://i15a203.p.ssafy.io/grafana
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - i15a203.p.ssafy.io
    path: /grafana
    pathType: Prefix
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  additionalDataSources:
    - name: Loki MYSIL
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# k3s exposes some control-plane components differently from kubeadm. Keep
# the node, pod, workload, and API server dashboards while avoiding targets
# that are commonly unreachable on a single-node k3s installation.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
