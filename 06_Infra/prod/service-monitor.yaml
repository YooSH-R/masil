apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - s15a203-prod
  selector:
    matchLabels:
      monitoring: backend
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
