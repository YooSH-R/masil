apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-dev-prefix
spec:
  stripPrefix:
    prefixes:
      - /dev
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-dev-swagger
spec:
  redirectRegex:
    regex: '^https?://([^/]+)/dev/swagger-ui/(.*)'
    replacement: 'https://${1}/dev/api/swagger-ui/${2}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: s15a203-dev-strip-dev-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: i15a203.p.ssafy.io
      http:
        paths:
          - path: /dev/api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /dev/api/v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /dev/api/swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /dev/api/swagger-ui.html
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-swagger-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: s15a203-dev-redirect-dev-swagger@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: i15a203.p.ssafy.io
      http:
        paths:
          - path: /dev/swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
