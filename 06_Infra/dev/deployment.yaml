apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        checksum/backend-secrets: "__BACKEND_SECRET_CHECKSUM__"
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: backend-auth-secret
            - secretRef:
                name: backend-db-secret
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
              value: /dev/api/v3/api-docs/swagger-config
            - name: SPRINGDOC_SWAGGER_UI_URL
              value: /dev/api/v3/api-docs
            - name: SPRINGDOC_SWAGGER_UI_OAUTH2_REDIRECT_URL
              value: https://i15a203.p.ssafy.io/dev/api/swagger-ui/oauth2-redirect.html
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/mysil
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: MQTT_ENABLED
              value: "true"
            - name: MQTT_URL
              value: tcp://mosquitto:1883
            - name: MQTT_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-mqtt-secret
                  key: MQTT_USERNAME
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-mqtt-secret
                  key: MQTT_PASSWORD
            - name: S3_ENABLED
              value: "true"
            - name: AWS_REGION
              value: ap-northeast-2
            - name: S3_BUCKET
              value: walk-picture-s3-483461801092-ap-northeast-2-an
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-s3-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-s3-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-auth-secret
                  key: JWT_SECRET
            - name: SOLAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-sms-secret
                  key: SOLAPI_API_KEY
            - name: SOLAPI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-sms-secret
                  key: SOLAPI_SECRET_KEY
            - name: SOLAPI_SENDER
              valueFrom:
                secretKeyRef:
                  name: backend-sms-secret
                  key: SOLAPI_SENDER
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
