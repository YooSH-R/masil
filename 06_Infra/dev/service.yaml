apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  labels:
    monitoring: backend
spec:
  selector:
    app: backend
  ports:
    - name: management
      port: 8081
      targetPort: management
