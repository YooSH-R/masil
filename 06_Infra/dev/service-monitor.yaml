apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - s15a203-dev
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /api/actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
