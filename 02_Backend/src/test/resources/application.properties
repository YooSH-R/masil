spring.datasource.url=jdbc:h2:mem:mysil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

auth.google.client-id=test-google-client-id
auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
auth.signup-token-ttl=10m
auth.access-token-ttl=1h
auth.refresh-token-ttl=30d
auth.access-token-validity-seconds=1800
auth.refresh-token-validity-seconds=2592000
auth.jwt.issuer=mysil-test
auth.jwt.secret=test-secret-key-with-at-least-thirty-two-bytes
