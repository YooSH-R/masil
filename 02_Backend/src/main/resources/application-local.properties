server.servlet.context-path=/dev/api

spring.datasource.url=jdbc:h2:mem:mysil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

solapi.api-key=local-placeholder
solapi.secret-key=local-placeholder
solapi.sender=01000000000

mqtt.enabled=false
storage.s3.enabled=false
