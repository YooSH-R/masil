spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

solapi.api-key=${SOLAPI_API_KEY:}
solapi.secret-key=${SOLAPI_SECRET_KEY:}
solapi.sender=${SOLAPI_SENDER:}
auth.verification.code-validity-seconds=${VERIFICATION_CODE_VALIDITY_SECONDS:180}
auth.verification.token-validity-seconds=${VERIFICATION_TOKEN_VALIDITY_SECONDS:600}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mysil}
spring.datasource.username=${DB_USERNAME:mysil}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

auth.jwt.secret=${JWT_SECRET}
auth.access-token-validity-seconds=${ACCESS_TOKEN_VALIDITY_SECONDS:1800}
auth.refresh-token-validity-seconds=${REFRESH_TOKEN_VALIDITY_SECONDS:2592000}
auth.google.client-id=${GOOGLE_CLIENT_ID}
auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
auth.signup-token-ttl=10m

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.url=${MQTT_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:robot-pet-backend}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.completion-timeout-ms=${MQTT_COMPLETION_TIMEOUT_MS:5000}

storage.s3.enabled=${S3_ENABLED:false}
storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:ap-northeast-2}
storage.s3.presign-duration-seconds=${S3_PRESIGN_DURATION_SECONDS:300}
storage.s3.max-file-size-bytes=${S3_MAX_FILE_SIZE_BYTES:10485760}
