spring.datasource.url=jdbc:h2:mem:mysil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:s3local-schema.sql
spring.jpa.open-in-view=false

auth.kakao.allowed-audience=local-kakao-client

storage.s3.enabled=true
storage.s3.bucket=walk-picture-s3-483461801092-ap-northeast-2-an
storage.s3.region=ap-northeast-2
storage.s3.presign-duration-seconds=300
storage.s3.max-file-size-bytes=${S3_MAX_FILE_SIZE_BYTES:10485760}
storage.s3.max-markdown-bytes=${S3_MAX_MARKDOWN_BYTES:1048576}
storage.s3.api-call-attempt-timeout-seconds=${S3_API_CALL_ATTEMPT_TIMEOUT_SECONDS:2}
storage.s3.api-call-timeout-seconds=${S3_API_CALL_TIMEOUT_SECONDS:5}
walk.diary.local-test-device-id=device-001
pet.local-test-pet-id=900001
mqtt.enabled=${MQTT_ENABLED:false}
